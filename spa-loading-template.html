<style>
    html {
        background: #000711;
    }

    #spots {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
    }

    .loading {
        background-color: rgba(112, 112, 112, 0.3);
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 40px;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(40px);
    }

    #brand {
        mask-image: url("/brand.svg");
        mask-repeat: no-repeat;
        mask-size: contain;
        mask-position: bottom left;
        height: 64px;
        width: 400px;
        background-color: #000711;
    }

    #spinner {
        margin-bottom: -80px;
    }

    @keyframes spotlight {
        0% {
            transform: rotate3d(1, 0, 0, 30deg);
        }
        25% {
            transform: rotate3d(0, 0, 1, -30deg);
        }
        50% {
            transform: rotate3d(1, 0, 1, 30deg);
        }
        75% {
            transform: rotate3d(0, 0, 1, -30deg);
        }
        100% {
            transform: rotate3d(1, 0, 0, 30deg);
        }
    }

    @keyframes spotlight2 {
        0% {
            transform: rotate3d(1, 0, 0, -30deg);
        }
        25% {
            transform: rotate3d(0, 0, 1, 30deg);
        }
        50% {
            transform: rotate3d(1, 0, 1, -30deg);
        }
        75% {
            transform: rotate3d(0, 0, 1, 30deg);
        }
        100% {
            transform: rotate3d(1, 0, 0, -30deg);
        }
    }

    .spotlight {
        position: absolute;
        transform-origin: bottom;
        object-fit: cover;
        width: auto;
    }
    #spot-1 {
        animation: spotlight 120s infinite;
        height: 190%;
        bottom: -66%;
        right: -120px;
        filter: blur(40px);
    }
    #spot-2 {
        animation: spotlight2 120s infinite reverse;
        height: 185%;
        bottom: -66%;
        left: -120px;
        filter: blur(40px);
    }
    #spot-3 {
        animation: spotlight2 120s infinite reverse;
        bottom: 0;
        right: 120px;
        height: 165%;
        filter: blur(16px);
    }
    #spot-4 {
        animation: spotlight 120s infinite;
        bottom: 0;
        left: 120px;
        height: 160%;
        filter: blur(16px);
    }
</style>
<div id="spots">
    <img src="/spotlight.svg" loading="lazy" id="spot-1" alt="spotlight" class="spotlight" />
    <img src="/spotlight.svg" loading="lazy" id="spot-2" alt="spotlight" class="spotlight" />
    <img src="/spotlight.svg" loading="lazy" id="spot-3" alt="spotlight" class="spotlight" />
    <img src="/spotlight.svg" loading="lazy" id="spot-4" alt="spotlight" class="spotlight" />
</div>
<div class="loading">
    <div id="brand"></div>
    <svg id="spinner" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24">
        <g stroke="#000711" stroke-width="1">
            <circle cx="12" cy="12" r="9.5" fill="none" stroke-linecap="round" stroke-width="3">
                <animate attributeName="stroke-dasharray" calcMode="spline" dur="1.5s" keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite" values="0 150;42 150;42 150;42 150" />
                <animate attributeName="stroke-dashoffset" calcMode="spline" dur="1.5s" keySplines="0.42,0,0.58,1;0.42,0,0.58,1;0.42,0,0.58,1" keyTimes="0;0.475;0.95;1" repeatCount="indefinite" values="0;-16;-59;-59" />
            </circle>
            <animateTransform attributeName="transform" dur="2s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12" />
        </g>
    </svg>
</div>
